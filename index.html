<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tepix AI Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Tepix AI Chat</h1>
            <p>Powered by Groq</p>
        </div>
        
        <div id="api-key-section" class="api-key-section">
            <input type="password" id="api-key-input" placeholder="Enter your Groq API Key" class="api-key-input">
            <button id="save-key-btn" class="btn">Save & Chat</button>
        </div>

        <div id="chat-messages" class="chat-messages"></div>
        
        <div id="input-section" class="input-section">
            <input type="text" id="user-input" placeholder="Type a message..." class="chat-input" autocomplete="off">
            <button id="send-btn" class="btn send-btn">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
